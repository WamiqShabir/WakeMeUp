<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake Up</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    input {
      font-size: 1.4rem;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      text-align: center;
      width: 180px;
      margin-bottom: 20px;
    }
    button {
      font-size: 1.6rem;
      padding: 18px 40px;
      border: none;
      border-radius: 16px;
      background: #ff3b30;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: none;
      box-shadow: 0 8px 25px rgba(255, 59, 48, 0.4);
    }
    button:active { transform: scale(0.96); }
    .status { margin-top: 24px; color: #aaa; min-height: 24px; }
  </style>
</head>
<body>
  <h1>Enter Code</h1>
  <input type="password" id="code" placeholder="****" maxlength="10" autofocus>
  <button id="wakeBtn">WAKE UP</button>
  <div class="status" id="status"></div>

  <script>
    // ★ CHANGE THIS to your own secret topic (same as in the app)
    const TOPIC = "wakeup-2006-yourname123";

    const codeInput = document.getElementById("code");
    const wakeBtn = document.getElementById("wakeBtn");
    const status = document.getElementById("status");

    codeInput.addEventListener("input", () => {
      if (codeInput.value === "2006") {
        wakeBtn.style.display = "block";
        status.textContent = "Code correct – ready";
      } else {
        wakeBtn.style.display = "none";
        status.textContent = "";
      }
    });

    wakeBtn.addEventListener("click", async () => {
      wakeBtn.disabled = true;
      status.textContent = "Sending wake signal…";

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: "WAKE_UP_NOW",
          headers: {
            "Title": "Wake Up!",
            "Priority": "max",
            "Tags": "rotating_light,alarm_clock"
          }
        });

        if (res.ok) {
          status.textContent = "Signal sent! Phone should start flashing & ringing.";
        } else {
          status.textContent = "Error sending signal.";
        }
      } catch (e) {
        status.textContent = "Network error: " + e.message;
      }

      setTimeout(() => {
        wakeBtn.disabled = false;
      }, 3000);
    });
  </script>
</body>
</html>
