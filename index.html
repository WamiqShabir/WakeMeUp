<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #050508;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 59, 48, 0.18) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 48px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #71717a;
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    input, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1.1rem;
      color: white;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: rgba(255, 59, 48, 0.5);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.15);
    }

    #code {
      text-align: center;
      letter-spacing: 8px;
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    #messageBox {
      display: none;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    #messageBox textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
    }

    #wakeBtn {
      display: none;
      background: linear-gradient(135deg, #ff3b30 0%, #ff2d55 100%);
      color: white;
      box-shadow: 0 10px 30px -5px rgba(255, 59, 48, 0.4);
    }

    #wakeBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px -5px rgba(255, 59, 48, 0.5);
    }

    #wakeBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .choice-buttons {
      display: none;
      gap: 12px;
      margin-top: 16px;
    }

    .choice-buttons button {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
    }

    #yesBtn {
      background: #22c55e;
      color: white;
    }

    #noBtn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .status {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #a1a1aa;
      min-height: 24px;
    }

    .status.success { color: #34d399; }
    .status.error { color: #f87171; }

    .footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #52525b;
      text-align: center;
    }

    .card {
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Wake Up</h1>
      <p class="subtitle">Enter the access code</p>

      <input type="password" id="code" placeholder="••••" maxlength="8" autocomplete="off" autofocus>

      <button id="wakeBtn" class="btn">Wake Up Device</button>

      <!-- Ask for message -->
      <div class="choice-buttons" id="choiceButtons">
        <button id="yesBtn">Yes, add message</button>
        <button id="noBtn">No, just wake</button>
      </div>

      <!-- Message input -->
      <div id="messageBox">
        <textarea id="customMessage" placeholder="Type your message here..."></textarea>
        <button id="sendWithMessage" class="btn" style="background: linear-gradient(135deg, #ff3b30, #ff2d55); color: white; margin-top: 12px;">
          Send Wake + Message
        </button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="footer">Secure remote trigger</div>
  </div>

  <script>
    // ★★★ CHANGE THIS to your real topic ★★★
    const TOPIC = "Wakeup-Munna2006-123";

    const codeInput = document.getElementById("code");
    const wakeBtn = document.getElementById("wakeBtn");
    const choiceButtons = document.getElementById("choiceButtons");
    const messageBox = document.getElementById("messageBox");
    const customMessage = document.getElementById("customMessage");
    const sendWithMessage = document.getElementById("sendWithMessage");
    const status = document.getElementById("status");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    // Show Wake button when code is correct
    codeInput.addEventListener("input", () => {
      if (codeInput.value === "2006") {
        wakeBtn.style.display = "block";
        status.textContent = "Code accepted";
        status.className = "status success";
      } else {
        wakeBtn.style.display = "none";
        choiceButtons.style.display = "none";
        messageBox.style.display = "none";
        status.textContent = "";
        status.className = "status";
      }
    });

    // When main Wake button is clicked → ask for message
    wakeBtn.addEventListener("click", () => {
      wakeBtn.style.display = "none";
      choiceButtons.style.display = "flex";
      status.textContent = "Do you want to add a custom message?";
      status.className = "status";
    });

    // User chooses YES → show message box
    yesBtn.addEventListener("click", () => {
      choiceButtons.style.display = "none";
      messageBox.style.display = "block";
      customMessage.focus();
      status.textContent = "Type your message below";
    });

    // User chooses NO → send normal wake
    noBtn.addEventListener("click", () => {
      sendWake("WAKE_UP_NOW", "Wake Up!");
    });

    // Send with custom message
    sendWithMessage.addEventListener("click", () => {
      const msg = customMessage.value.trim();
      if (!msg) {
        status.textContent = "Please type a message first";
        status.className = "status error";
        return;
      }
      sendWake(msg, "Message from WakeMeUp");
    });

    // Main send function
    async function sendWake(body, title) {
      status.textContent = "Sending…";
      status.className = "status";
      sendWithMessage.disabled = true;
      noBtn.disabled = true;

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: body,
          headers: {
            "Title": title,
            "Priority": "max",
            "Tags": "rotating_light,alarm_clock"
          }
        });

        if (res.ok) {
          status.textContent = "Signal sent successfully!";
          status.className = "status success";

          // Reset UI after 3 seconds
          setTimeout(() => {
            resetUI();
          }, 3000);
        } else {
          throw new Error("Failed");
        }
      } catch (e) {
        status.textContent = "Connection error – try again";
        status.className = "status error";
        sendWithMessage.disabled = false;
        noBtn.disabled = false;
      }
    }

    function resetUI() {
      choiceButtons.style.display = "none";
      messageBox.style.display = "none";
      wakeBtn.style.display = "block";
      customMessage.value = "";
      sendWithMessage.disabled = false;
      noBtn.disabled = false;
      status.textContent = "Ready";
      status.className = "status";
    }
  </script>
</body>
</html>
