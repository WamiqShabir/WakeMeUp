<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #050508;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 59, 48, 0.18) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 48px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #71717a;
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    input, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1.1rem;
      color: white;
      outline: none;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      border-color: rgba(255, 59, 48, 0.5);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.15);
    }

    #code {
      text-align: center;
      letter-spacing: 8px;
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 10px;
    }

    #wakeBtn {
      display: none;
      background: linear-gradient(135deg, #ff3b30 0%, #ff2d55 100%);
      color: white;
      box-shadow: 0 10px 30px -5px rgba(255, 59, 48, 0.4);
    }

    #wakeBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px -5px rgba(255, 59, 48, 0.5);
    }

    /* Three choice buttons */
    #choiceButtons {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    #choiceButtons button {
      padding: 15px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      color: white;
    }

    #justWake { background: #3b82f6; }
    #withMessage { background: #8b5cf6; }
    #withSpeak { background: #22c55e; }

    #messageBox {
      display: none;
      margin-top: 20px;
    }

    #messageBox textarea {
      min-height: 100px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .status {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #a1a1aa;
      min-height: 24px;
    }
    .status.success { color: #34d399; }
    .status.error { color: #f87171; }

    .footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #52525b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Wake Up</h1>
      <p class="subtitle">Enter the access code</p>

      <input type="password" id="code" placeholder="••••" maxlength="8" autocomplete="off" autofocus>

      <button id="wakeBtn" class="btn">Wake Up Device</button>

      <!-- Three options -->
      <div id="choiceButtons">
        <button id="justWake">1. Just Wake Up</button>
        <button id="withMessage">2. Wake + Custom Message</button>
        <button id="withSpeak">3. Wake + Message + Read Aloud</button>
      </div>

      <!-- Message input (shared for option 2 and 3) -->
      <div id="messageBox">
        <textarea id="customMessage" placeholder="Type the message here..."></textarea>
        <button id="sendBtn" class="btn" style="background: linear-gradient(135deg, #ff3b30, #ff2d55); color: white;">
          Send Now
        </button>
      </div>

      <div class="status" id="status"></div>
    </div>
    <div class="footer">Secure remote trigger</div>
  </div>

  <script>
    // ★★★ CHANGE THIS to your real topic ★★★
    const TOPIC = "Wakeup-Munna2006-123";

    const codeInput = document.getElementById("code");
    const wakeBtn = document.getElementById("wakeBtn");
    const choiceButtons = document.getElementById("choiceButtons");
    const messageBox = document.getElementById("messageBox");
    const customMessage = document.getElementById("customMessage");
    const sendBtn = document.getElementById("sendBtn");
    const status = document.getElementById("status");

    let mode = ""; // "message" or "speak"

    // Show main button when code is correct
    codeInput.addEventListener("input", () => {
      if (codeInput.value === "2006") {
        wakeBtn.style.display = "block";
        status.textContent = "Code accepted";
        status.className = "status success";
      } else {
        resetAll();
      }
    });

    // Show the 3 choices
    wakeBtn.addEventListener("click", () => {
      wakeBtn.style.display = "none";
      choiceButtons.style.display = "flex";
      status.textContent = "Choose an option";
      status.className = "status";
    });

    // Option 1 - Just Wake
    document.getElementById("justWake").addEventListener("click", () => {
      sendWake("WAKE_UP_NOW", "Wake Up!", false);
    });

    // Option 2 - Message only
    document.getElementById("withMessage").addEventListener("click", () => {
      mode = "message";
      choiceButtons.style.display = "none";
      messageBox.style.display = "block";
      customMessage.focus();
      status.textContent = "Type your message";
    });

    // Option 3 - Message + Read Aloud
    document.getElementById("withSpeak").addEventListener("click", () => {
      mode = "speak";
      choiceButtons.style.display = "none";
      messageBox.style.display = "block";
      customMessage.focus();
      status.textContent = "Type the message that will be spoken";
    });

    // Send button
    sendBtn.addEventListener("click", () => {
      const msg = customMessage.value.trim();
      if (!msg) {
        status.textContent = "Please type a message first";
        status.className = "status error";
        return;
      }

      if (mode === "speak") {
        // Special prefix so MacroDroid knows it should speak
        sendWake("SPEAK:" + msg, "Message + Speak", true);
      } else {
        sendWake(msg, "Custom Message", false);
      }
    });

    async function sendWake(body, title, isSpeak) {
      status.textContent = "Sending…";
      status.className = "status";
      sendBtn.disabled = true;

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: body,
          headers: {
            "Title": title,
            "Priority": "max",
            "Tags": isSpeak ? "loudspeaker,rotating_light" : "rotating_light,alarm_clock"
          }
        });

        if (res.ok) {
          status.textContent = "Signal sent successfully!";
          status.className = "status success";
          setTimeout(resetAll, 2800);
        } else {
          throw new Error("Failed");
        }
      } catch (e) {
        status.textContent = "Connection error – try again";
        status.className = "status error";
        sendBtn.disabled = false;
      }
    }

    function resetAll() {
      wakeBtn.style.display = codeInput.value === "2006" ? "block" : "none";
      choiceButtons.style.display = "none";
      messageBox.style.display = "none";
      customMessage.value = "";
      sendBtn.disabled = false;
      status.textContent = codeInput.value === "2006" ? "Code accepted" : "";
      status.className = codeInput.value === "2006" ? "status success" : "status";
    }
  </script>
</body>
</html>
