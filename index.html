<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #050508;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 59, 48, 0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 9s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.85; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px 28px;
      backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #71717a;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    #code {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      font-size: 1.5rem;
      color: white;
      text-align: center;
      letter-spacing: 10px;
      outline: none;
      margin-bottom: 24px;
      transition: all 0.25s ease;
    }

    #code:focus {
      border-color: rgba(255, 59, 48, 0.6);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.15);
    }

    /* Main Wake Button */
    #wakeBtn {
      display: none;
      width: 100%;
      background: linear-gradient(135deg, #ff3b30, #ff2d55);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 30px -5px rgba(255, 59, 48, 0.45);
      transition: all 0.25s ease;
    }

    #wakeBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px -5px rgba(255, 59, 48, 0.55);
    }

    /* Options Section */
    #optionsSection {
      display: none;
      margin-top: 8px;
    }

    .options-title {
      font-size: 1rem;
      color: #a1a1aa;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .option-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .option-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .option-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .icon-1 { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .icon-2 { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
    .icon-3 { background: rgba(34, 197, 94, 0.15); color: #4ade80; }

    .option-text h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .option-text p {
      font-size: 0.82rem;
      color: #71717a;
    }

    /* Message Box */
    #messageSection {
      display: none;
      margin-top: 12px;
      text-align: left;
    }

    #messageSection label {
      display: block;
      font-size: 0.9rem;
      color: #a1a1aa;
      margin-bottom: 8px;
    }

    #customMessage {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      font-size: 1rem;
      color: white;
      min-height: 110px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      margin-bottom: 16px;
    }

    #customMessage:focus {
      border-color: rgba(255, 59, 48, 0.5);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.12);
    }

    #sendBtn {
      width: 100%;
      background: linear-gradient(135deg, #ff3b30, #ff2d55);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    #sendBtn:hover {
      transform: translateY(-2px);
    }

    #sendBtn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .back-btn {
      background: none;
      border: none;
      color: #71717a;
      font-size: 0.9rem;
      margin-top: 14px;
      cursor: pointer;
      width: 100%;
    }

    .back-btn:hover {
      color: #a1a1aa;
    }

    .status {
      margin-top: 22px;
      font-size: 0.9rem;
      color: #a1a1aa;
      min-height: 22px;
    }

    .status.success { color: #34d399; }
    .status.error { color: #f87171; }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #52525b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Wake Up</h1>
      <p class="subtitle">Enter the access code</p>

      <input type="password" id="code" placeholder="••••" maxlength="10" autocomplete="off" autofocus>

      <button id="wakeBtn">Wake Up Device</button>

      <!-- Options -->
      <div id="optionsSection">
        <div class="options-title">Choose what to do</div>

        <div class="option-card" id="opt1">
          <div class="option-icon icon-1">⚡</div>
          <div class="option-text">
            <h3>Just Wake Up</h3>
            <p>Flash + Vibrate + Alarm only</p>
          </div>
        </div>

        <div class="option-card" id="opt2">
          <div class="option-icon icon-2">💬</div>
          <div class="option-text">
            <h3>Wake + Message</h3>
            <p>Send a custom message in the notification</p>
          </div>
        </div>

        <div class="option-card" id="opt3">
          <div class="option-icon icon-3">🔊</div>
          <div class="option-text">
            <h3>Wake + Message + Speak</h3>
            <p>Phone will read the message out loud</p>
          </div>
        </div>
      </div>

      <!-- Message Input -->
      <div id="messageSection">
        <label id="messageLabel">Type your message</label>
        <textarea id="customMessage" placeholder="Write anything here..."></textarea>
        <button id="sendBtn">Send Now</button>
        <button class="back-btn" id="backBtn">← Back to options</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="footer">Secure remote trigger</div>
  </div>

  <script>
    const TOPIC = "Wakeup-Munna2006-123";

    const codeInput = document.getElementById("code");
    const wakeBtn = document.getElementById("wakeBtn");
    const optionsSection = document.getElementById("optionsSection");
    const messageSection = document.getElementById("messageSection");
    const customMessage = document.getElementById("customMessage");
    const sendBtn = document.getElementById("sendBtn");
    const status = document.getElementById("status");
    const messageLabel = document.getElementById("messageLabel");
    const backBtn = document.getElementById("backBtn");

    let selectedMode = ""; // "message" or "speak"

    // Code check
    codeInput.addEventListener("input", () => {
      if (codeInput.value === "2006") {
        wakeBtn.style.display = "block";
        status.textContent = "Code accepted";
        status.className = "status success";
      } else {
        resetUI();
      }
    });

    // Show options
    wakeBtn.addEventListener("click", () => {
      wakeBtn.style.display = "none";
      optionsSection.style.display = "block";
      status.textContent = "";
    });

    // Option 1 - Just Wake
    document.getElementById("opt1").addEventListener("click", () => {
      sendSignal("WAKE_UP_NOW", "Wake Up!", false);
    });

    // Option 2 - Message
    document.getElementById("opt2").addEventListener("click", () => {
      selectedMode = "message";
      optionsSection.style.display = "none";
      messageSection.style.display = "block";
      messageLabel.textContent = "Type your message";
      customMessage.focus();
    });

    // Option 3 - Speak
    document.getElementById("opt3").addEventListener("click", () => {
      selectedMode = "speak";
      optionsSection.style.display = "none";
      messageSection.style.display = "block";
      messageLabel.textContent = "Type the message to be spoken";
      customMessage.focus();
    });

    // Back button
    backBtn.addEventListener("click", () => {
      messageSection.style.display = "none";
      optionsSection.style.display = "block";
      customMessage.value = "";
    });

    // Send message
    sendBtn.addEventListener("click", () => {
      const msg = customMessage.value.trim();
      if (!msg) {
        status.textContent = "Please type a message";
        status.className = "status error";
        return;
      }

      if (selectedMode === "speak") {
        sendSignal("SPEAK:" + msg, "Message + Speak", true);
      } else {
        sendSignal(msg, "Custom Message", false);
      }
    });

    async function sendSignal(body, title, isSpeak) {
      status.textContent = "Sending signal...";
      status.className = "status";
      sendBtn.disabled = true;

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: body,
          headers: {
            "Title": title,
            "Priority": "max",
            "Tags": isSpeak ? "loudspeaker,rotating_light" : "rotating_light,alarm_clock"
          }
        });

        if (res.ok) {
          status.textContent = "Signal sent successfully!";
          status.className = "status success";
          setTimeout(resetUI, 2500);
        } else {
          throw new Error();
        }
      } catch (e) {
        status.textContent = "Failed to send. Try again.";
        status.className = "status error";
        sendBtn.disabled = false;
      }
    }

    function resetUI() {
      wakeBtn.style.display = codeInput.value === "2006" ? "block" : "none";
      optionsSection.style.display = "none";
      messageSection.style.display = "none";
      customMessage.value = "";
      sendBtn.disabled = false;
      status.textContent = codeInput.value === "2006" ? "Code accepted" : "";
      status.className = codeInput.value === "2006" ? "status success" : "status";
    }
  </script>
</body>
</html>
