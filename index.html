<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #050508;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 59, 48, 0.14) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 10s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.18); opacity: 0.8; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 44px 28px 36px;
      backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
      text-align: center;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.6px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #71717a;
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    /* Code Input */
    #code {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 17px;
      font-size: 1.55rem;
      color: white;
      text-align: center;
      letter-spacing: 12px;
      outline: none;
      margin-bottom: 24px;
      transition: all 0.25s ease;
    }

    #code:focus {
      border-color: rgba(255, 59, 48, 0.55);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.12);
    }

    /* Main Button */
    #wakeBtn {
      display: none;
      width: 100%;
      background: linear-gradient(135deg, #ff3b30, #ff2d55);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 28px -5px rgba(255, 59, 48, 0.45);
      transition: all 0.25s ease;
    }

    #wakeBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -5px rgba(255, 59, 48, 0.55);
    }

    /* Options */
    #optionsSection {
      display: none;
    }

    .section-title {
      font-size: 0.95rem;
      color: #a1a1aa;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .option {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .option:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    .option-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }

    .icon-wake {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .icon-message {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
    }

    .option-content h3 {
      font-size: 1.08rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .option-content p {
      font-size: 0.83rem;
      color: #71717a;
      line-height: 1.35;
    }

    /* Message Section */
    #messageSection {
      display: none;
      text-align: left;
    }

    #messageSection label {
      display: block;
      font-size: 0.9rem;
      color: #a1a1aa;
      margin-bottom: 10px;
      font-weight: 500;
    }

    #customMessage {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      font-size: 1rem;
      color: white;
      min-height: 120px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      margin-bottom: 16px;
      transition: all 0.25s ease;
    }

    #customMessage:focus {
      border-color: rgba(255, 59, 48, 0.5);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.12);
    }

    #sendBtn {
      width: 100%;
      background: linear-gradient(135deg, #ff3b30, #ff2d55);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    #sendBtn:hover {
      transform: translateY(-2px);
    }

    #sendBtn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .back-link {
      display: block;
      width: 100%;
      background: none;
      border: none;
      color: #71717a;
      font-size: 0.9rem;
      margin-top: 18px;
      cursor: pointer;
      text-align: center;
      padding: 6px;
    }

    .back-link:hover {
      color: #a1a1aa;
    }

    .status {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #a1a1aa;
      min-height: 22px;
    }

    .status.success { color: #34d399; }
    .status.error { color: #f87171; }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #52525b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Wake Up</h1>
      <p class="subtitle">Enter the access code</p>

      <!-- Code Input -->
      <input type="password" id="code" placeholder="••••" maxlength="8" autocomplete="off" autofocus>

      <!-- Main Button -->
      <button id="wakeBtn">Wake Up Device</button>

      <!-- Options -->
      <div id="optionsSection">
        <div class="section-title">What would you like to do?</div>

        <div class="option" id="optWake">
          <div class="option-icon icon-wake">⚡</div>
          <div class="option-content">
            <h3>Just Wake Up</h3>
            <p>Flashlight + Vibration + Alarm</p>
          </div>
        </div>

        <div class="option" id="optMessage">
          <div class="option-icon icon-message">💬</div>
          <div class="option-content">
            <h3>Wake + Message</h3>
            <p>Send a custom message with the wake signal</p>
          </div>
        </div>

        <button class="back-link" id="backToCode">← Back</button>
      </div>

      <!-- Message Input -->
      <div id="messageSection">
        <label>Type your message</label>
        <textarea id="customMessage" placeholder="Write anything here..."></textarea>
        <button id="sendBtn">Send Wake + Message</button>
        <button class="back-link" id="backToOptions">← Back to options</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="footer">Secure remote trigger</div>
  </div>

  <script>
    const TOPIC = "Wakeup-Munna2006-123";

    const codeInput = document.getElementById("code");
    const wakeBtn = document.getElementById("wakeBtn");
    const optionsSection = document.getElementById("optionsSection");
    const messageSection = document.getElementById("messageSection");
    const customMessage = document.getElementById("customMessage");
    const sendBtn = document.getElementById("sendBtn");
    const status = document.getElementById("status");

    // Code check
    codeInput.addEventListener("input", () => {
      if (codeInput.value === "2006") {
        wakeBtn.style.display = "block";
        status.textContent = "Code accepted";
        status.className = "status success";
      } else {
        resetToStart();
      }
    });

    // Show options
    wakeBtn.addEventListener("click", () => {
      wakeBtn.style.display = "none";
      optionsSection.style.display = "block";
      status.textContent = "";
    });

    // Back to code
    document.getElementById("backToCode").addEventListener("click", () => {
      optionsSection.style.display = "none";
      wakeBtn.style.display = "block";
    });

    // Option 1 - Just Wake
    document.getElementById("optWake").addEventListener("click", () => {
      sendSignal("WAKE_UP_NOW", "Wake Up!");
    });

    // Option 2 - Message
    document.getElementById("optMessage").addEventListener("click", () => {
      optionsSection.style.display = "none";
      messageSection.style.display = "block";
      customMessage.focus();
    });

    // Back to options
    document.getElementById("backToOptions").addEventListener("click", () => {
      messageSection.style.display = "none";
      optionsSection.style.display = "block";
      customMessage.value = "";
      status.textContent = "";
    });

    // Send message
    sendBtn.addEventListener("click", () => {
      const msg = customMessage.value.trim();
      if (!msg) {
        status.textContent = "Please type a message first";
        status.className = "status error";
        return;
      }
      sendSignal(msg, "Custom Message");
    });

    async function sendSignal(body, title) {
      status.textContent = "Sending signal...";
      status.className = "status";
      sendBtn.disabled = true;

      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}`, {
          method: "POST",
          body: body,
          headers: {
            "Title": title,
            "Priority": "max",
            "Tags": "rotating_light,alarm_clock"
          }
        });

        if (res.ok) {
          status.textContent = "Signal sent successfully!";
          status.className = "status success";
          setTimeout(resetToStart, 2500);
        } else {
          throw new Error();
        }
      } catch (e) {
        status.textContent = "Failed to send. Try again.";
        status.className = "status error";
        sendBtn.disabled = false;
      }
    }

    function resetToStart() {
      wakeBtn.style.display = codeInput.value === "2006" ? "block" : "none";
      optionsSection.style.display = "none";
      messageSection.style.display = "none";
      customMessage.value = "";
      sendBtn.disabled = false;
      status.textContent = codeInput.value === "2006" ? "Code accepted" : "";
      status.className = codeInput.value === "2006" ? "status success" : "status";
    }
  </script>
</body>
</html>
